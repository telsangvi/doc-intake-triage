<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intake Triage - Review Queue</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2b; --panel2: #1e2536; --line: #2b3446;
    --text: #e6ebf5; --muted: #93a0b8; --accent: #5b8cff;
    --green: #2fbf71; --amber: #e0a83a; --red: #e0574d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 28px 32px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 24px 32px 60px; max-width: 1100px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; background: var(--panel);
    padding: 26px; text-align: center; color: var(--muted);
  }
  .drop.hover { border-color: var(--accent); color: var(--text); }
  .drop input { display: none; }
  .drop label { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .row { display: flex; gap: 12px; align-items: center; margin: 18px 0 8px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 13px; }
  .summary { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 13px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin: 12px 0;
  }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 9px; border-radius: 999px; color: #0b0f18;
  }
  .auto_route { background: var(--green); }
  .human_review { background: var(--amber); }
  .incomplete { background: var(--red); color: #fff; }
  .fields { display: grid; grid-template-columns: 180px 1fr; gap: 4px 16px; margin: 12px 0; }
  .fields .k { color: var(--muted); font-size: 13px; }
  .fields .v { font-size: 13px; }
  .low { color: var(--amber); }
  .note { color: var(--muted); font-size: 12.5px; }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Document Intake Triage</h1>
  <p>Drop case documents in. The pipeline classifies, extracts, and routes each one to
     auto-route, human review, or back-to-applicant.</p>
</header>
<main>
  <div class="drop" id="drop">
    <input type="file" id="files" multiple />
    <div>Drag files here, or <label for="files">choose files</label>.</div>
    <div class="note" style="margin-top:6px">Try the files in <code>data/samples/</code>.</div>
  </div>

  <div class="row">
    <button id="go" disabled>Process queue</button>
    <span class="status" id="status"></span>
  </div>

  <div class="summary" id="summary"></div>
  <div id="results"></div>
</main>

<script>
const drop = document.getElementById('drop');
const input = document.getElementById('files');
const go = document.getElementById('go');
const status = document.getElementById('status');
const results = document.getElementById('results');
const summary = document.getElementById('summary');
let chosen = [];

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hover');
  setFiles([...e.dataTransfer.files]);
});
input.addEventListener('change', () => setFiles([...input.files]));

function setFiles(list) {
  chosen = list;
  go.disabled = list.length === 0;
  status.textContent = list.length ? `${list.length} file(s) selected` : '';
}

go.addEventListener('click', async () => {
  const form = new FormData();
  chosen.forEach(f => form.append('files', f));
  go.disabled = true;
  status.textContent = 'Processing...';
  results.innerHTML = ''; summary.innerHTML = '';
  try {
    const res = await fetch('/queue', { method: 'POST', body: form });
    if (!res.ok) throw new Error(await res.text());
    render(await res.json());
    status.textContent = 'Done.';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  } finally {
    go.disabled = false;
  }
});

function render(items) {
  const counts = items.reduce((a, r) => (a[r.decision] = (a[r.decision] || 0) + 1, a), {});
  summary.innerHTML = Object.entries(counts)
    .map(([k, v]) => `<span class="chip">${k.replace('_',' ')}: <b>${v}</b></span>`).join('');

  results.innerHTML = items.map(r => {
    const e = r.extraction;
    const rows = Object.entries(e.fields)
      .filter(([, f]) => f.value !== null && f.value !== '')
      .map(([k, f]) => {
        const cls = f.confidence < 0.6 ? 'v low' : 'v';
        return `<div class="k">${k}</div><div class="${cls}">${escapeHtml(f.value)}
                <span class="note">(${f.confidence.toFixed(2)})</span></div>`;
      }).join('');
    return `<div class="card">
      <h3>${escapeHtml(r.source_file)}
        <span class="badge ${r.decision}">${r.decision.replace('_',' ')}</span></h3>
      <div class="note">Type: <b>${e.doc_type}</b> (${e.doc_type_confidence.toFixed(2)})
        &middot; case ${escapeHtml(r.case_id)}</div>
      <div class="fields">${rows || '<div class="k">No fields</div>'}</div>
      ${r.missing_fields.length ? `<div class="note">Missing: ${r.missing_fields.join(', ')}</div>` : ''}
      ${r.flags.length ? `<div class="note">Flags: ${r.flags.join(', ')}</div>` : ''}
      ${(r.policy_refs && r.policy_refs.length)
          ? `<div class="note">Policy: ${r.policy_refs.map(x => escapeHtml(x.clause)).join('; ')}</div>` : ''}
      <div class="note" style="margin-top:8px">${escapeHtml(r.rationale)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
